# kitty — the terminal.
#
# Colours are in theme.conf, generated from the palette. This file is layout
# and behaviour only, so a flavour switch never touches it.
#
# Replaces the old Alacritty config, which asked for Consolas (a Windows font
# that does not exist on Fedora) and mixed Windows Terminal ANSI colours with a
# Catppuccin background.

include theme.conf

# --- font -------------------------------------------------------------------
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5
disable_ligatures never
modify_font cell_height 108%

# --- window -----------------------------------------------------------------
background_opacity      0.90
background_blur         1
window_padding_width    10
hide_window_decorations yes
confirm_os_window_close 0
placement_strategy      center
remember_window_size    no
initial_window_width    120c
initial_window_height   34c

# --- tabs -------------------------------------------------------------------
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# --- scrollback -------------------------------------------------------------
scrollback_lines        20000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

# --- cursor -----------------------------------------------------------------
cursor_shape            beam
cursor_blink_interval   0.6
cursor_trail            3

# --- bell -------------------------------------------------------------------
enable_audio_bell       no
window_alert_on_bell    yes

# --- shell integration ------------------------------------------------------
shell_integration       enabled
allow_remote_control    yes
listen_on               unix:/tmp/kitty
# kitten ssh carries terminfo and the theme to the remote host, which is the
# single biggest quality-of-life win when you live in SSH sessions.

# --- key bindings -----------------------------------------------------------
map ctrl+shift+enter    new_window
map ctrl+shift+t        new_tab
map ctrl+shift+w        close_window
map ctrl+shift+left     previous_tab
map ctrl+shift+right    next_tab
map ctrl+shift+h        show_scrollback
map ctrl+plus           change_font_size all +1.0
map ctrl+minus          change_font_size all -1.0
map ctrl+0              change_font_size all 0
map ctrl+shift+f        launch --location=hsplit
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+c        copy_to_clipboard
