# hypridle — dim, lock, blank, suspend.
#
# The timings are read from settings.lua by scripts/idle-config.sh, which
# rewrites the listeners below whenever you change them in the settings GUI.
# The defaults here match settings.example.lua.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 5 min: dim, so you get a warning rather than a surprise
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min: screen off
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
