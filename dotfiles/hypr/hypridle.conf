# hypridle — dim, lock, blank, suspend.
#
# ⚠️ THIS FILE IS THE TEMPLATE, NOT THE ONE IN USE.
#
# The file hypridle actually reads is ~/.config/hypr/hypridle.conf, and it is
# GENERATED by scripts/idle-config.sh from the timings in settings.lua. Change
# them under Settings → Power, or with `bhctl set idle.lock_after=900`. What
# stands here is what the generator produces from the defaults in
# settings.example.lua, kept so the shape of the file can be read in the
# repository — and so a machine that never runs the generator still has
# something sane to fall back on.
#
# Editing this file alone changes nothing on an installed machine.
#
# It used to BE the installed file, symlinked straight out of the repository.
# That is why the Power page had four sliders that wrote to settings.lua and
# were read by nobody.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # ⚠️ Lua, not `hyprctl dispatch dpms on`. Under the Lua config provider the
    # old word form is a syntax error that hyprctl prints to stdout before
    # exiting 0 — so the screen never blanked and nothing ever said so.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 5 min: dim, so you get a warning rather than a surprise.
# -c backlight, because without it brightnessctl picks whatever device it
# considers current — on a machine with no screen backlight that is an LED.
listener {
    timeout = 300
    on-timeout = brightnessctl -c backlight -s set 10%
    on-resume = brightnessctl -c backlight -r
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min: screen off
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Suspend has no listener here because settings.example.lua ships
# idle.suspend_after = 0. Set it above zero and the generator adds one with
# `on-timeout = systemctl suspend`.
